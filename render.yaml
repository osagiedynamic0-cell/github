services:
  - type: web
    name: email-bot
    env: python
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 300 --worker-class gthread
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
    plan: free
